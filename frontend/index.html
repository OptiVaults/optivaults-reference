    content="OptiVaults V1 is the public-launch version of a non-custodial auto-yield stablecoin vault on Cardano, currently pre-launch (design + Aiken implementation complete, external audit target Q2-Q3 2027). Users deposit USDCx (issued by Circle via xReserve, launched on Cardano February 2026) and receive vUSDCx share tokens whose value accrues via auto-compounding. A keeper deploys capital to Liqwid Finance stablecoin markets (DJED, USDM) and Minswap V2 swap routes for diversified yield. Architecture: 17 Aiken PlutusV3 logic validators + 4 NFT mint policies + 1 DEX adapter using the Withdraw-Zero Forwarding Pattern — vault_proxy forwards to one of 10 staking validators (vault_user / vault_keeper_hot / vault_batcher / vault_swap_ada / vault_protocol / vault_recall / vault_liqwid / vault_gov_policy / vault_gov_emergency / vault_admin_deploy). 29-field VaultDatum with 15 immutable. Governance: m-of-n multisig with 7-21 day timelocks + 1-of-n cancel veto (3-of-3 unanimity targeted at launch). Three-way Compound fee split (launch 40% keeper / 0% gov / 60% treasury, hard caps 40/10/50). UpdateFeeSplit 21-day timelock. UpdateSlippagePolicy 48-hour timelock. Phase 1 three-layer governance safety (Layer 1 EmergencyWithdraw freeze-only / Layer 2 frozen-state USDCx swap-out / Layer 3 90-day permissionless CommunitySunset). License: Apache 2.0." />
